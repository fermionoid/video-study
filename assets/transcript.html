    <p class="speech"><time datetime="PT42S">00:42</time><b class="speaker">主持人</b>我们先看实际例子。周五交接工作的时候，你会留下哪些信息？</p>
    <p class="speech"><time datetime="PT48S">00:48</time><b class="speaker">分享者</b>我会写清楚现在做到哪一步、下一步由谁接手，以及对方需要在哪里查资料。</p>
